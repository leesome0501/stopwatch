<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>빅뱅 크로노그래프</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  :root{
    --void: #05050b;
    --panel: rgba(17, 16, 30, 0.52);
    --panel-strong: rgba(20, 19, 36, 0.72);
    --panel-border: rgba(255, 255, 255, 0.13);
    --text: #f3f1ff;
    --text-dim: #9b9ac0;
    --accent: #ffb84d;
    --accent-ink: #241503;
    --accent-2: #4fe9d4;
    --worst: #ff4fb8;
    --rule: rgba(255, 255, 255, 0.10);
    --shadow: rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  html, body{ height: 100%; }

  body{
    margin: 0;
    background: var(--void);
    color: var(--text);
    font-family: 'IBM Plex Sans KR', 'IBM Plex Sans', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px 40px;
    min-height: 100%;
    position: relative;
    overflow-x: hidden;
  }

  #cosmos{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
  }
  .vignette{
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 38%, transparent 0%, rgba(3,3,10,0.35) 62%, rgba(2,2,8,0.72) 100%);
  }

  .instrument{
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .eyebrow{
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .eyebrow .mark{
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow .dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: background .2s ease, box-shadow .2s ease;
  }
  .eyebrow .dot.live{
    background: var(--accent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  @media (prefers-reduced-motion: no-preference){
    .eyebrow .dot.live{ animation: pulse 1.6s ease-in-out infinite; }
  }
  @keyframes pulse{
    0%, 100% { opacity: 1; }
    50% { opacity: .4; }
  }

  .dial{
    position: relative;
    background: var(--panel);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--panel-border);
    border-radius: 22px;
    padding: 30px 28px 32px;
    box-shadow: 0 24px 60px -28px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    overflow: hidden;
  }

  .dial svg.ticks{
    position: absolute;
    top: 50%;
    left: 50%;
    width: 360px;
    height: 360px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0.55;
  }
  .dial svg.ticks line{ stroke: rgba(255,255,255,0.16); stroke-width: 1.4; }
  .dial svg.ticks line.major{ stroke: rgba(255,255,255,0.3); stroke-width: 2.2; }

  .epoch{
    position: relative;
    z-index: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-height: 40px;
    justify-content: flex-end;
  }
  .epoch .title{
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--accent);
  }
  .epoch .sub{
    font-size: 11.5px;
    color: var(--text-dim);
  }

  .readout{
    position: relative;
    z-index: 1;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: clamp(44px, 11vw, 62px);
    line-height: 1;
    letter-spacing: -0.01em;
    display: flex;
    align-items: baseline;
    gap: 2px;
    text-shadow: 0 0 26px rgba(255, 184, 77, 0.28);
  }
  .readout .cent{
    font-size: 0.48em;
    color: var(--text-dim);
    text-shadow: none;
  }

  .status{
    position: relative;
    z-index: 1;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    min-height: 18px;
  }

  .controls{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .controls .primary{ grid-column: 1 / -1; }

  button{
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    border-radius: 12px;
    padding: 15px 20px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform .12s ease, filter .12s ease, background .12s ease, border-color .12s ease;
    letter-spacing: 0.01em;
  }
  button:active{ transform: scale(0.98); }
  button:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button:disabled{
    opacity: .35;
    cursor: not-allowed;
  }

  .btn-start{
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 10px 26px -12px rgba(255, 184, 77, 0.55);
  }
  .btn-start:hover:not(:disabled){ filter: brightness(1.06); }
  .btn-start.is-running{
    background: var(--panel-strong);
    color: var(--accent);
    border-color: var(--accent);
    box-shadow: none;
  }

  .btn-outline{
    background: var(--panel-strong);
    color: var(--text);
    border-color: var(--panel-border);
  }
  .btn-outline:hover:not(:disabled){ border-color: rgba(255,255,255,0.4); }

  .laps{
    background: var(--panel);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    overflow: hidden;
  }
  .laps-head{
    display: grid;
    grid-template-columns: 44px 1fr 1fr;
    gap: 8px;
    padding: 10px 18px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 1px solid var(--rule);
  }
  .laps-body{
    max-height: 236px;
    overflow-y: auto;
  }
  .lap-row{
    display: grid;
    grid-template-columns: 44px 1fr 1fr;
    gap: 8px;
    padding: 11px 18px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    border-bottom: 1px solid var(--rule);
  }
  .lap-row:last-child{ border-bottom: none; }
  .lap-row .idx{ color: var(--text-dim); }
  .lap-row.best .split{ color: var(--accent-2); font-weight: 700; }
  .lap-row.worst .split{ color: var(--worst); font-weight: 700; }

  .hint{
    text-align: center;
    font-size: 11.5px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }
  .hint kbd{
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    background: var(--panel-strong);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 11px;
  }
  .blurb{
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    opacity: 0.75;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <canvas id="cosmos" aria-hidden="true"></canvas>
  <div class="vignette"></div>

  <div class="instrument">
    <div class="eyebrow">
      <span class="mark"><span class="dot" id="liveDot"></span>빅뱅 크로노그래프</span>
      <span id="lapCount">0랩</span>
    </div>

    <div class="dial">
      <svg class="ticks" viewBox="0 0 340 340" aria-hidden="true"></svg>
      <div class="epoch" id="epoch">
        <div class="title" id="epochTitle">빅뱅 이전</div>
        <div class="sub" id="epochSub">특이점 · 시간이 시작되기 전</div>
      </div>
      <div class="readout" id="readout" aria-live="off">
        <span id="mm">00</span><span>:</span><span id="ss">00</span><span class="cent">.<span id="cc">00</span></span>
      </div>
      <div class="status" id="status">정지됨 · 시작하면 빅뱅이 시작됩니다</div>
    </div>

    <div class="controls">
      <button class="primary btn-start" id="startBtn">시작</button>
      <button class="btn-outline" id="lapBtn" disabled>랩 기록</button>
      <button class="btn-outline" id="resetBtn" disabled>초기화</button>
    </div>

    <div class="laps" id="lapsPanel" hidden>
      <div class="laps-head">
        <span>#</span><span>랩 타임</span><span>총 시간</span>
      </div>
      <div class="laps-body" id="lapsBody"></div>
    </div>

    <p class="hint"><kbd>Space</kbd> 시작·정지 &nbsp;·&nbsp; <kbd>L</kbd> 랩 &nbsp;·&nbsp; <kbd>R</kbd> 초기화</p>
    <p class="blurb">10분 동안 138억 년의 우주를 압축해 재현합니다. 10분이 지나면 배경은 현재의 우주로 고정됩니다.</p>
  </div>

<script>
(function(){
  /* ---------- 다이얼 눈금 ---------- */
  const ticksSvg = document.querySelector('.dial svg.ticks');
  const ticksFrag = document.createDocumentFragment();
  const tcx = 170, tcy = 170, rOuter = 168, rInnerMinor = 154, rInnerMajor = 144;
  for(let i = 0; i < 60; i++){
    const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
    const isMajor = i % 5 === 0;
    const rInner = isMajor ? rInnerMajor : rInnerMinor;
    const x1 = tcx + Math.cos(angle) * rOuter;
    const y1 = tcy + Math.sin(angle) * rOuter;
    const x2 = tcx + Math.cos(angle) * rInner;
    const y2 = tcy + Math.sin(angle) * rInner;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1.toFixed(2));
    line.setAttribute('y1', y1.toFixed(2));
    line.setAttribute('x2', x2.toFixed(2));
    line.setAttribute('y2', y2.toFixed(2));
    if(isMajor) line.setAttribute('class', 'major');
    ticksFrag.appendChild(line);
  }
  ticksSvg.appendChild(ticksFrag);

  /* ---------- 우주 캔버스 ---------- */
  const canvas = document.getElementById('cosmos');
  const ctx = canvas.getContext('2d');
  let vw = 0, vh = 0;

  function resizeCanvas(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    vw = window.innerWidth;
    vh = window.innerHeight;
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function hexToRgb(hex){
    const v = hex.replace('#','');
    return {
      r: parseInt(v.substring(0,2),16),
      g: parseInt(v.substring(2,4),16),
      b: parseInt(v.substring(4,6),16)
    };
  }
  function rgbaHex(hex, a){
    const c = hexToRgb(hex);
    return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + Math.max(0, Math.min(1,a)) + ')';
  }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function clamp01(t){ return Math.max(0, Math.min(1,t)); }
  function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }
  function easeInCubic(t){ return t*t*t; }
  function lerpColorHex(hexA, hexB, t){
    const a = hexToRgb(hexA), b = hexToRgb(hexB);
    const r = Math.round(lerp(a.r,b.r,t));
    const g = Math.round(lerp(a.g,b.g,t));
    const bl = Math.round(lerp(a.b,b.b,t));
    return '#' + [r,g,bl].map(n => n.toString(16).padStart(2,'0')).join('');
  }

  const COSMIC_DURATION = 600000; // 10분 = 현재 우주 완성

  const STAR_COLORS = ['#ffffff', '#dce6ff', '#fff3d6', '#ffd9ad'];
  const NEBULA_COLORS = ['#ff3fa4', '#37e6d1', '#7c6bff', '#ffb84d'];

  function makeStars(n){
    const arr = [];
    for(let i=0;i<n;i++){
      arr.push({
        x: Math.random(), y: Math.random(),
        r: 0.6 + Math.random()*1.5,
        color: STAR_COLORS[(Math.random()*STAR_COLORS.length)|0],
        appearAt: 55000 + Math.random()*525000,
        fadeIn: 3000 + Math.random()*5000,
        twinkleSpeed: 0.0015 + Math.random()*0.0035,
        twinklePhase: Math.random()*Math.PI*2,
        baseAlpha: 0.55 + Math.random()*0.45
      });
    }
    return arr;
  }
  function makeNebulae(n){
    const arr = [];
    for(let i=0;i<n;i++){
      arr.push({
        x: 0.12 + Math.random()*0.76, y: 0.12 + Math.random()*0.76,
        r: 0.11 + Math.random()*0.10,
        color: NEBULA_COLORS[i % NEBULA_COLORS.length],
        appearAt: 150000 + Math.random()*370000,
        fadeIn: 22000 + Math.random()*20000,
        alpha: 0.10 + Math.random()*0.09,
        dx: (Math.random()-0.5)*0.00000015,
        dy: (Math.random()-0.5)*0.00000015
      });
    }
    return arr;
  }
  function makeGalaxies(n){
    const arr = [];
    for(let i=0;i<n;i++){
      arr.push({
        x: 0.12 + Math.random()*0.76, y: 0.14 + Math.random()*0.70,
        rx: 0.05 + Math.random()*0.045,
        squash: 0.32 + Math.random()*0.2,
        rot: Math.random()*Math.PI,
        color: NEBULA_COLORS[(i+1) % NEBULA_COLORS.length],
        appearAt: 330000 + Math.random()*250000,
        fadeIn: 16000 + Math.random()*16000
      });
    }
    return arr;
  }

  const stars = makeStars(170);
  const nebulae = makeNebulae(7);
  const galaxies = makeGalaxies(4);

  function drawBang(w, h, ms){
    if(ms >= 60000 || ms <= 0) return;
    const t1 = 1200, t2 = 15000, t3 = 60000;
    const maxR = Math.hypot(w,h) * 0.72;
    const cx = w/2, cy = h*0.42;
    let radius, alpha, color;
    if(ms < t1){
      const p = ms/t1;
      radius = lerp(2, maxR*0.48, easeOutCubic(p));
      alpha = 1;
      color = lerpColorHex('#fffdf6', '#fff2cf', p);
    } else if(ms < t2){
      const p = (ms-t1)/(t2-t1);
      radius = lerp(maxR*0.48, maxR*1.05, p);
      alpha = 1;
      color = lerpColorHex('#fff2cf', '#ff7a3d', p);
    } else {
      const p = (ms-t2)/(t3-t2);
      radius = maxR*1.05;
      alpha = lerp(1, 0, easeInCubic(p));
      color = lerpColorHex('#ff7a3d', '#7a2410', p);
    }
    const grad = ctx.createRadialGradient(cx,cy,0, cx,cy,radius);
    grad.addColorStop(0, rgbaHex(color, alpha));
    grad.addColorStop(0.55, rgbaHex(color, alpha*0.45));
    grad.addColorStop(1, rgbaHex(color, 0));
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);
  }

  function drawSingularity(w,h){
    const cx = w/2, cy = h*0.42;
    const grad = ctx.createRadialGradient(cx,cy,0, cx,cy,46);
    grad.addColorStop(0, 'rgba(255,253,246,0.95)');
    grad.addColorStop(0.15, 'rgba(255,246,224,0.5)');
    grad.addColorStop(1, 'rgba(255,246,224,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx,cy,46,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fffdf6';
    ctx.beginPath();
    ctx.arc(cx,cy,2.2,0,Math.PI*2);
    ctx.fill();
  }

  function drawScene(rawMs){
    if(vw === 0) resizeCanvas();
    const ms = Math.max(0, Math.min(rawMs, COSMIC_DURATION));
    const w = vw, h = vh;

    ctx.fillStyle = '#05050b';
    ctx.fillRect(0,0,w,h);

    if(ms <= 0){
      drawSingularity(w,h);
      return;
    }

    for(const nb of nebulae){
      if(ms < nb.appearAt) continue;
      const fade = clamp01((ms - nb.appearAt)/nb.fadeIn);
      const cx = (nb.x + nb.dx*ms) * w;
      const cy = (nb.y + nb.dy*ms) * h;
      const R = nb.r * Math.min(w,h);
      const grad = ctx.createRadialGradient(cx,cy,0, cx,cy,R);
      grad.addColorStop(0, rgbaHex(nb.color, nb.alpha*fade));
      grad.addColorStop(1, rgbaHex(nb.color, 0));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx,cy,R,0,Math.PI*2);
      ctx.fill();
    }

    for(const gx of galaxies){
      if(ms < gx.appearAt) continue;
      const fade = clamp01((ms - gx.appearAt)/gx.fadeIn);
      const cx = gx.x*w, cy = gx.y*h;
      const Rx = gx.rx * Math.min(w,h);
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(gx.rot);
      ctx.scale(1, gx.squash);
      const grad = ctx.createRadialGradient(0,0,0, 0,0,Rx);
      grad.addColorStop(0, rgbaHex('#fff6e0', 0.45*fade));
      grad.addColorStop(0.4, rgbaHex(gx.color, 0.20*fade));
      grad.addColorStop(1, rgbaHex(gx.color, 0));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0,0,Rx,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    for(const s of stars){
      if(ms < s.appearAt) continue;
      const fade = clamp01((ms - s.appearAt)/s.fadeIn);
      const twinkle = 0.7 + 0.3*Math.sin(ms*s.twinkleSpeed + s.twinklePhase);
      const alpha = fade * s.baseAlpha * twinkle;
      ctx.fillStyle = rgbaHex(s.color, alpha);
      ctx.beginPath();
      ctx.arc(s.x*w, s.y*h, s.r, 0, Math.PI*2);
      ctx.fill();
    }

    drawBang(w,h,ms);
  }

  window.addEventListener('resize', () => { resizeCanvas(); drawScene(currentElapsed()); });

  /* ---------- 우주 시대 라벨 ---------- */
  function getEpoch(ms){
    if(ms <= 0) return { title: '빅뱅 이전', sub: '특이점 · 시간이 시작되기 전' };
    if(ms < 1200) return { title: '빅뱅', sub: '모든 것의 시작' };
    if(ms < 15000) return { title: '급팽창 · 플라스마 시대', sub: '초고온 · 초고밀도 팽창' };
    if(ms < 60000) return { title: '재결합 시대', sub: '빅뱅 후 약 38만 년 · 최초의 빛' };
    if(ms < 180000) return { title: '최초의 별들', sub: '빅뱅 후 약 2~4억 년' };
    if(ms < 360000) return { title: '은하 형성기', sub: '빅뱅 후 약 10억 년' };
    if(ms < COSMIC_DURATION) return { title: '우주 거대구조 형성', sub: '수십억 년에 걸친 팽창' };
    return { title: '현재의 우주', sub: '빅뱅 후 약 138억 년' };
  }

  /* ---------- 스톱워치 로직 ---------- */
  const mmEl = document.getElementById('mm');
  const ssEl = document.getElementById('ss');
  const ccEl = document.getElementById('cc');
  const statusEl = document.getElementById('status');
  const epochTitleEl = document.getElementById('epochTitle');
  const epochSubEl = document.getElementById('epochSub');
  const liveDot = document.getElementById('liveDot');
  const lapCountEl = document.getElementById('lapCount');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const resetBtn = document.getElementById('resetBtn');
  const lapsPanel = document.getElementById('lapsPanel');
  const lapsBody = document.getElementById('lapsBody');

  let running = false;
  let startTime = 0;
  let elapsedBeforePause = 0;
  let laps = [];
  let rafId = null;

  function pad(n, len){ return String(n).padStart(len, '0'); }

  function currentElapsed(){
    return running ? elapsedBeforePause + (performance.now() - startTime) : elapsedBeforePause;
  }

  function render(){
    const ms = currentElapsed();
    const totalCentis = Math.floor(ms / 10);
    const cc = totalCentis % 100;
    const totalSeconds = Math.floor(totalCentis / 100);
    const ss = totalSeconds % 60;
    const mm = Math.floor(totalSeconds / 60);
    mmEl.textContent = pad(mm, 2);
    ssEl.textContent = pad(ss, 2);
    ccEl.textContent = pad(cc, 2);

    const epoch = getEpoch(Math.min(ms, COSMIC_DURATION));
    epochTitleEl.textContent = epoch.title;
    epochSubEl.textContent = epoch.sub;

    drawScene(ms);
  }

  function loop(){
    render();
    if(running) rafId = requestAnimationFrame(loop);
  }

  function formatFixed(ms){
    const totalCentis = Math.floor(ms / 10);
    const cc = totalCentis % 100;
    const totalSeconds = Math.floor(totalCentis / 100);
    const ss = totalSeconds % 60;
    const mm = Math.floor(totalSeconds / 60);
    return pad(mm, 2) + ':' + pad(ss, 2) + '.' + pad(cc, 2);
  }

  function renderLaps(){
    lapCountEl.textContent = laps.length + '랩';
    if(laps.length === 0){
      lapsPanel.hidden = true;
      return;
    }
    lapsPanel.hidden = false;
    const splits = laps.map(l => l.split);
    const fastest = Math.min(...splits);
    const slowest = Math.max(...splits);
    const showExtremes = laps.length > 1;
    lapsBody.innerHTML = '';
    for(let i = laps.length - 1; i >= 0; i--){
      const lap = laps[i];
      const row = document.createElement('div');
      row.className = 'lap-row';
      if(showExtremes && lap.split === fastest) row.classList.add('best');
      else if(showExtremes && lap.split === slowest) row.classList.add('worst');
      row.innerHTML =
        '<span class="idx">' + (i + 1) + '</span>' +
        '<span class="split">' + formatFixed(lap.split) + '</span>' +
        '<span class="total">' + formatFixed(lap.total) + '</span>';
      lapsBody.appendChild(row);
    }
  }

  function setStatus(){
    if(running){
      statusEl.textContent = '진행 중 · ' + (laps.length > 0 ? laps.length + '번째 랩 구간' : '우주가 팽창하는 중');
    } else if(elapsedBeforePause > 0){
      statusEl.textContent = '정지됨 · 이어서 진행하거나 초기화하세요';
    } else {
      statusEl.textContent = '정지됨 · 시작하면 빅뱅이 시작됩니다';
    }
  }

  function start(){
    if(running) return;
    running = true;
    startTime = performance.now();
    startBtn.textContent = '정지';
    startBtn.classList.add('is-running');
    lapBtn.disabled = false;
    resetBtn.disabled = true;
    liveDot.classList.add('live');
    setStatus();
    rafId = requestAnimationFrame(loop);
  }

  function stop(){
    if(!running) return;
    running = false;
    elapsedBeforePause = currentElapsed();
    cancelAnimationFrame(rafId);
    startBtn.textContent = '시작';
    startBtn.classList.remove('is-running');
    lapBtn.disabled = true;
    resetBtn.disabled = false;
    liveDot.classList.remove('live');
    render();
    setStatus();
  }

  function toggle(){ running ? stop() : start(); }

  function lap(){
    if(!running) return;
    const total = currentElapsed();
    const prevTotal = laps.length ? laps[laps.length - 1].total : 0;
    laps.push({ split: total - prevTotal, total });
    renderLaps();
    setStatus();
  }

  function reset(){
    if(running) return;
    elapsedBeforePause = 0;
    laps = [];
    render();
    renderLaps();
    setStatus();
  }

  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', lap);
  resetBtn.addEventListener('click', reset);

  window.addEventListener('keydown', (e) => {
    if(e.code === 'Space'){ e.preventDefault(); toggle(); }
    else if(e.key === 'l' || e.key === 'L'){ lap(); }
    else if(e.key === 'r' || e.key === 'R'){ reset(); }
  });

  resizeCanvas();
  render();
  renderLaps();
})();
</script>
</body>
</html>
