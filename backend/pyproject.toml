[project]
name = "assethub"
version = "0.1.0"
description = "AssetHub 백엔드: 가족 자산관리 API"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "httpx>=0.27",
    "tzdata>=2024.1; sys_platform == 'win32'",  # Windows 에는 시간대 DB가 없어 Asia/Seoul 을 찾으려면 필요
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "tzdata>=2024.1; sys_platform == 'win32'",  # Windows 에는 시간대 DB가 없어 Asia/Seoul 을 찾으려면 필요
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assethub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
